# docker-compose.yml

version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    # This volume persists the database data on your host machine
    volumes:
      - db_data:/var/lib/postgresql/data
      # This line mounts your SQL script. The postgres image will automatically
      # execute any .sql files in this directory on initialization.
      # This makes your local setup perfectly match your Kamal setup.
      - ./db/production.sql:/docker-entrypoint-initdb.d/init.sql
    # These variables MUST match the 'production' block in your database.yml
    # and the password in your .env file.
    environment:
      # The user that will be created with superuser privileges.
      POSTGRES_USER: stencilai
      # We remove POSTGRES_DB because the init.sql script now handles all database creation.
      POSTGRES_PASSWORD: ${POSTGRESPASSWORD}

  web:
    build: . # Build the image from the Dockerfile in the current directory
    restart: always
    # Expose port 3000 on the host and map it to port 80 in the container
    ports:
      - "3000:80"
    # This ensures the db container is running before the web container starts
    depends_on:
      - db
    # Pass environment variables from the .env file to the container
    # This is much more secure and flexible than hardcoding them.
    environment:
      RAILS_ENV: production
      # This is the crucial change: tell Rails to find the database at host 'db'
      DATABASE_HOST: db
      # These will be loaded from your .env file
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      POSTGRESPASSWORD: ${POSTGRESPASSWORD}

volumes:
  db_data: # Defines the named volume for persistent database data